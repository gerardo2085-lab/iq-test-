<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IQ Assessment</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #0a0a0c;
  --surface:    #111116;
  --border:     #1c1c26;
  --accent:     #c8f542;
  --accent-dim: rgba(200,245,66,0.10);
  --text:       #ededf0;
  --muted:      #5a5a6e;
  --ok:         #4ecb82;
  --no:         #f0505e;
  --font:       'Courier New', Courier, monospace;
}

/* ── HIGH CONTRAST MODE ───────────────────────────────────── */
html.hc {
  --bg:         #ffffff;
  --surface:    #f0f0f0;
  --border:     #000000;
  --accent:     #000000;
  --accent-dim: rgba(0,0,0,0.08);
  --text:       #000000;
  --muted:      #222222;
  --ok:         #007700;
  --no:         #cc0000;
}
html.hc .q-text,
html.hc .opt            { color: #000000; }
html.hc .btn-solid      { color: #ffffff; }
html.hc .tag.domain-tag { border-color: rgba(0,0,0,0.4); }
html.hc .profile-card   { border: 1px solid rgba(0,0,0,0.3); border-left: 3px solid #000000; }
html.hc .opt.state-correct { background: rgba(0,119,0,.12); }
html.hc .opt.state-wrong   { background: rgba(204,0,0,.12); }
html.hc .opt.state-reveal  { background: rgba(0,119,0,.07); }

html.hc .intro-eyebrow  { font-size: 13px; }
html.hc .intro-title    { font-size: clamp(60px, 16vw, 100px); }
html.hc .intro-desc     { font-size: 16px; }
html.hc .ic-label       { font-size: 12px; }
html.hc .ic-val-text    { font-size: 16px; }
html.hc .share-note     { font-size: 14px; }
html.hc .q-num,
html.hc .q-score        { font-size: 14px; }
html.hc .q-text         { font-size: clamp(24px, 5vw, 32px); }
html.hc .q-sub          { font-size: 17px; }
html.hc .tag            { font-size: 12px; }
html.hc .opt            { font-size: 17px; }
html.hc .opt-key        { font-size: 13px; }
html.hc .feedback       { font-size: 15px; }
html.hc .timer-num      { font-size: 17px; }
html.hc .btn-solid      { font-size: 15px; }
html.hc .btn-outline    { font-size: 14px; }
html.hc .result-eyebrow { font-size: 13px; }
html.hc .iq-number      { font-size: clamp(88px, 20vw, 140px); }
html.hc .iq-class       { font-size: 18px; }
html.hc .iq-desc        { font-size: 15px; }
html.hc .iq-percentile  { font-size: 15px; }
html.hc .stat-val       { font-size: 36px; }
html.hc .stat-label     { font-size: 12px; }
html.hc .domains-title  { font-size: 12px; }
html.hc .domain-name    { font-size: 14px; }
html.hc .domain-pct     { font-size: 14px; }
html.hc .profile-key    { font-size: 16px; }
html.hc .profile-desc   { font-size: 16px; }
html.hc .result-note    { font-size: 14px; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
}

body {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 32px 16px;
}

/* ── page visibility ─────────────────────────────────────── */
.page { display: none; }
.page.active {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  max-width: 600px;
}

/* ── INTRO ───────────────────────────────────────────────── */
#p-intro { text-align: center; max-width: 480px; }

.lang-row {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 28px;
}

.btn-lang {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 6px 14px;
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .2em;
  cursor: pointer;
  transition: background .12s;
}
.btn-lang:hover { background: var(--accent-dim); }
.btn-lang.active-toggle {
  background: var(--accent);
  color: var(--bg);
}

.intro-eyebrow {
  font-size: 10px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 40px;
}

.intro-title {
  font-size: clamp(52px, 14vw, 88px);
  font-weight: 700;
  line-height: .95;
  letter-spacing: -.03em;
  margin-bottom: 20px;
}
.intro-title em { font-style: normal; color: var(--accent); }

.intro-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.75;
  letter-spacing: .04em;
  margin-bottom: 44px;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 40px;
}

.info-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px 18px;
  text-align: left;
}
.info-card .ic-label {
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
.info-card .ic-val-text {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.4;
}

.share-note {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .04em;
  margin-top: 20px;
  line-height: 1.6;
}

/* ── QUESTION ────────────────────────────────────────────── */
.q-topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}

.q-progress-col { flex: 1; }

.q-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.q-num   { font-size: 11px; letter-spacing: .18em; color: var(--muted); }
.q-score { font-size: 11px; letter-spacing: .18em; color: var(--accent); }

.progress-track { height: 2px; background: var(--border); }
.progress-fill  {
  height: 100%;
  background: var(--accent);
  transition: width .45s ease;
  width: 0%;
}

/* timer ring */
.timer-shell {
  position: relative;
  width: 54px;
  height: 54px;
  flex-shrink: 0;
}
.timer-svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg);
}
.t-track { fill: none; stroke: var(--border); stroke-width: 3; }
.t-ring  {
  fill: none;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linecap: round;
  stroke-dasharray: 138.23;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset .95s linear, stroke .25s;
}
.timer-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  transition: color .25s;
}
.timer-shell.urgent .t-ring    { stroke: var(--no); }
.timer-shell.urgent .timer-num { color: var(--no); }

/* question content */
.q-tags { display: flex; gap: 8px; margin-bottom: 14px; }
.tag {
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  padding: 4px 10px;
  border: 1px solid var(--border);
  color: var(--muted);
}
.tag.domain-tag { border-color: rgba(200,245,66,.25); color: var(--accent); }

.q-text {
  font-size: clamp(20px, 4vw, 26px);
  font-weight: 700;
  line-height: 1.45;
  color: #ffffff;
  margin-bottom: 10px;
  white-space: pre-wrap;
}
.q-sub {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.65;
  letter-spacing: .04em;
  margin-bottom: 28px;
  min-height: 1em;
}

/* options */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 18px;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 18px 22px;
  color: #ffffff;
  font-family: var(--font);
  font-size: 14px;
  text-align: left;
  cursor: pointer;
  line-height: 1.45;
  transition: border-color .12s, background .12s;
}
.opt:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-dim);
}
.opt:disabled { cursor: default; }
.opt-key {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--accent);
  min-width: 16px;
  flex-shrink: 0;
  padding-top: 1px;
}

.opt.state-correct { border-color: var(--ok); background: rgba(78,203,130,.09); }
.opt.state-correct .opt-key { color: var(--ok); }
.opt.state-wrong   { border-color: var(--no); background: rgba(240,80,94,.09); }
.opt.state-wrong   .opt-key { color: var(--no); }
.opt.state-reveal  { border-color: rgba(78,203,130,.5); background: rgba(78,203,130,.05); opacity: .75; }
.opt.state-reveal  .opt-key { color: var(--ok); }

/* feedback */
.feedback {
  display: none;
  font-size: 12px;
  letter-spacing: .08em;
  padding: 12px 16px;
  margin-bottom: 16px;
  line-height: 1.5;
}
.feedback.show       { display: block; }
.feedback.fb-ok      { background: rgba(78,203,130,.1);  color: var(--ok);    border-left: 3px solid var(--ok); }
.feedback.fb-no      { background: rgba(240,80,94,.1);   color: var(--no);    border-left: 3px solid var(--no); }
.feedback.fb-timeout { background: rgba(200,245,66,.07); color: var(--accent); border-left: 3px solid var(--accent); }

/* ── shared buttons ──────────────────────────────────────── */
.btn-solid {
  background: var(--accent);
  color: #0a0a0c;
  border: none;
  width: 100%;
  padding: 15px 32px;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-solid:hover { opacity: .82; }

.btn-outline {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 12px 28px;
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .22em;
  text-transform: uppercase;
  cursor: pointer;
  display: none;
  transition: background .12s;
}
.btn-outline:hover { background: var(--accent-dim); }
.btn-outline.show  { display: inline-block; }

/* ── RESULTS ─────────────────────────────────────────────── */
#p-result { max-width: 560px; }

.result-score-block {
  text-align: center;
  padding: 40px 0 36px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}
.result-eyebrow {
  font-size: 10px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}
.iq-number {
  font-size: clamp(80px, 18vw, 128px);
  font-weight: 700;
  line-height: 1;
  color: var(--accent);
  letter-spacing: -.04em;
}
.iq-class {
  font-size: 15px;
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-top: 10px;
  margin-bottom: 6px;
}
.iq-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.65;
  max-width: 400px;
  margin: 0 auto 6px;
  letter-spacing: .03em;
}
.iq-percentile { font-size: 12px; color: var(--muted); }

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 18px 16px;
  text-align: center;
}
.stat-val   { font-size: 30px; font-weight: 700; color: var(--accent); }
.stat-label {
  font-size: 9px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 5px;
}

.domains-section { margin-bottom: 36px; }
.domains-title {
  font-size: 9px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
}
.domain-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 13px;
}
.domain-name {
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--muted);
  width: 86px;
  flex-shrink: 0;
}
.domain-track {
  flex: 1;
  height: 5px;
  background: var(--border);
}
.domain-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width .9s ease;
}
.domain-pct {
  font-size: 11px;
  color: var(--accent);
  width: 34px;
  text-align: right;
  flex-shrink: 0;
}

/* cognitive profile */
.profile-section { margin-bottom: 36px; }
.profile-card {
  background: var(--surface);
  border: 1px solid rgba(200,245,66,.25);
  border-left: 3px solid var(--accent);
  padding: 20px 22px;
  margin-top: 14px;
}
.profile-key {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.profile-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.7;
  letter-spacing: .03em;
}

.result-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 8px;
}
.result-btns .btn-outline.show { display: block; }

.result-note {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.7;
  letter-spacing: .04em;
  text-align: center;
  margin-top: 20px;
  padding: 0 8px;
}
</style>
</head>
<body>

<!-- ═══════════════ INTRO ═══════════════ -->
<div id="p-intro" class="page active">
  <div class="lang-row">
    <button id="btn-contrast" class="btn-lang">HC</button>
    <button id="btn-lang" class="btn-lang">ES</button>
  </div>
  <p class="intro-eyebrow" id="intro-tag"></p>
  <h1 class="intro-title"  id="intro-title"></h1>
  <p class="intro-desc"    id="intro-desc"></p>
  <div class="info-grid"   id="info-grid"></div>
  <button class="btn-solid" id="btn-start"></button>
  <p class="share-note"    id="share-note"></p>
</div>

<!-- ═══════════════ QUESTION ═══════════════ -->
<div id="p-question" class="page">
  <div class="q-topbar">
    <div class="q-progress-col">
      <div class="q-meta-row">
        <span class="q-num"   id="q-num"></span>
        <span class="q-score" id="q-score"></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="q-bar"></div>
      </div>
    </div>
    <div class="timer-shell" id="timer-shell">
      <svg class="timer-svg" width="54" height="54" viewBox="0 0 54 54">
        <circle class="t-track" cx="27" cy="27" r="22"/>
        <circle class="t-ring"  cx="27" cy="27" r="22" id="t-ring"/>
      </svg>
      <div class="timer-num" id="t-num">30</div>
    </div>
  </div>

  <div class="q-tags">
    <span class="tag domain-tag" id="q-domain"></span>
    <span class="tag"            id="q-category"></span>
  </div>

  <div class="q-text" id="q-text"></div>
  <div class="q-sub"  id="q-sub"></div>

  <div class="options-list" id="q-opts"></div>
  <div class="feedback"     id="q-feedback"></div>

  <button class="btn-outline" id="btn-next"></button>
</div>

<!-- ═══════════════ RESULTS ═══════════════ -->
<div id="p-result" class="page">
  <div class="result-score-block">
    <p class="result-eyebrow" id="r-eyebrow"></p>
    <div class="iq-number"    id="r-iq">—</div>
    <div class="iq-class"     id="r-class"></div>
    <div class="iq-desc"      id="r-desc"></div>
    <div class="iq-percentile" id="r-pct"></div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val"   id="r-correct">0</div>
      <div class="stat-label" id="lbl-correct"></div>
    </div>
    <div class="stat-card">
      <div class="stat-val"   id="r-wrong">0</div>
      <div class="stat-label" id="lbl-wrong"></div>
    </div>
    <div class="stat-card">
      <div class="stat-val"   id="r-timeout">0</div>
      <div class="stat-label" id="lbl-timeout"></div>
    </div>
  </div>

  <div class="domains-section">
    <p class="domains-title" id="domains-title"></p>
    <div class="domain-row">
      <span class="domain-name" id="lbl-verbal"></span>
      <div class="domain-track"><div class="domain-fill" id="bar-verbal"></div></div>
      <span class="domain-pct"  id="pct-verbal">0%</span>
    </div>
    <div class="domain-row">
      <span class="domain-name" id="lbl-numerical"></span>
      <div class="domain-track"><div class="domain-fill" id="bar-numerical"></div></div>
      <span class="domain-pct"  id="pct-numerical">0%</span>
    </div>
    <div class="domain-row">
      <span class="domain-name" id="lbl-spatial"></span>
      <div class="domain-track"><div class="domain-fill" id="bar-spatial"></div></div>
      <span class="domain-pct"  id="pct-spatial">0%</span>
    </div>
    <div class="domain-row">
      <span class="domain-name" id="lbl-logic"></span>
      <div class="domain-track"><div class="domain-fill" id="bar-logic"></div></div>
      <span class="domain-pct"  id="pct-logic">0%</span>
    </div>
  </div>

  <div class="profile-section">
    <p class="domains-title" id="profile-label"></p>
    <div class="profile-card">
      <div class="profile-key"  id="profile-key"></div>
      <p   class="profile-desc" id="profile-desc"></p>
    </div>
  </div>

  <div class="result-btns">
    <button class="btn-solid"        id="btn-restart"></button>
    <button class="btn-outline show" id="btn-share"></button>
  </div>
  <p class="result-note" id="result-note"></p>
</div>

<script src="questions.js"></script>
<script>
window.onload = function () {

  var lang = 'en';
  var highContrast = false;
  var QUESTIONS;
  var LETTERS = ['A', 'B', 'C', 'D'];
  var CIRC    = 2 * Math.PI * 22;

  var cur, answers, timerID, secs, done, score;
  var domainTotals, domainHits;

  var DOMAIN_LABELS = {
    en: { Verbal: 'Verbal', Numerical: 'Numerical', Spatial: 'Spatial', Logic: 'Logic' },
    es: { Verbal: 'Verbal', Numerical: 'Numérico',  Spatial: 'Espacial', Logic: 'Lógica' }
  };

  var DIFFICULTY_LABELS = {
    en: { 1: '// Easy', 2: '// Medium', 3: '// Hard' },
    es: { 1: '// Fácil', 2: '// Medio',  3: '// Difícil' }
  };

  var STAT_LABELS = {
    en: { correct: 'Correct', wrong: 'Wrong',       timeout: 'Timeout'    },
    es: { correct: 'Correcto', wrong: 'Incorrecto', timeout: 'Sin tiempo' }
  };

  /* ── helpers ────────────────────────────────────────────── */
  function el(id) { return document.getElementById(id); }

  function show(id) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) { pages[i].classList.remove('active'); }
    el(id).classList.add('active');
  }

  /* ── language toggle ────────────────────────────────────── */
  function toggleLang() {
    lang = lang === 'en' ? 'es' : 'en';
    el('btn-lang').textContent = lang === 'en' ? 'ES' : 'EN';
    document.documentElement.lang = lang;
    renderIntro();
  }

  /* ── contrast toggle ────────────────────────────────────── */
  function toggleContrast() {
    highContrast = !highContrast;
    document.documentElement.classList.toggle('hc', highContrast);
    el('btn-contrast').textContent = highContrast ? 'NM' : 'HC';
    el('btn-contrast').classList.toggle('active-toggle', highContrast);
  }

  /* ── intro ──────────────────────────────────────────────── */
  function renderIntro() {
    var s = UI_STRINGS[lang];
    el('intro-tag').textContent   = s.tag;
    el('intro-title').innerHTML   =
      s.title1 + '<br>' + s.title2 + '<br><em>' + s.titleAccent + '</em>';
    el('intro-desc').textContent  = s.subtitle;
    el('info-grid').innerHTML     =
      infoCard(s.infoD,   s.infoDA)   +
      infoCard(s.infoT,   s.infoTA)   +
      infoCard(s.infoDif, s.infoDifA) +
      infoCard(s.infoS,   s.infoSA);
    el('btn-start').textContent   = s.begin;
    el('share-note').textContent  = s.shareNote;
  }

  function infoCard(label, val) {
    return '<div class="info-card">' +
             '<div class="ic-label">'    + label + '</div>' +
             '<div class="ic-val-text">' + val   + '</div>' +
           '</div>';
  }

  /* ── question selection ─────────────────────────────────── */
  function shuffleArray(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j   = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function selectRaw() {
    var quotas   = [['Verbal', 4], ['Numerical', 4], ['Spatial', 4], ['Logic', 3]];
    var selected = [];
    for (var d = 0; d < quotas.length; d++) {
      var dom   = quotas[d][0];
      var count = quotas[d][1];
      var pool  = [];
      for (var i = 0; i < QUESTION_BANK.length; i++) {
        if (QUESTION_BANK[i].domain === dom) { pool.push(QUESTION_BANK[i]); }
      }
      shuffleArray(pool);
      var take = Math.min(count, pool.length);
      for (var i = 0; i < take; i++) { selected.push(pool[i]); }
    }
    shuffleArray(selected);
    return selected;
  }

  function buildRuntimeQuestion(q) {
    var perm       = [0, 1, 2, 3];
    shuffleArray(perm);
    var origAnswer = q[lang].a;
    var opts       = [];
    for (var i = 0; i < perm.length; i++) { opts.push(q[lang].o[perm[i]]); }
    return {
      domain:     q.domain,
      difficulty: q.difficulty,
      text:       q[lang].q,
      sub:        q[lang].s,
      opts:       opts,
      answer:     perm.indexOf(origAnswer)
    };
  }

  /* ── game flow ──────────────────────────────────────────── */
  function startTest() {
    var raw = selectRaw();
    QUESTIONS = [];
    for (var i = 0; i < raw.length; i++) { QUESTIONS.push(buildRuntimeQuestion(raw[i])); }

    cur   = 0;
    score = 0;
    answers = [];
    for (var i = 0; i < QUESTIONS.length; i++) { answers.push(-1); }

    domainTotals = { Verbal: 0, Numerical: 0, Spatial: 0, Logic: 0 };
    domainHits   = { Verbal: 0, Numerical: 0, Spatial: 0, Logic: 0 };
    for (var i = 0; i < QUESTIONS.length; i++) { domainTotals[QUESTIONS[i].domain]++; }

    show('p-question');
    renderQuestion();
  }

  function renderQuestion() {
    clearInterval(timerID);
    done = false;

    var q   = QUESTIONS[cur];
    var s   = UI_STRINGS[lang];
    var pct = Math.round((cur / QUESTIONS.length) * 100);

    el('q-num').textContent      = s.questionOf + ' ' + (cur + 1) + ' ' + s.of + ' ' + QUESTIONS.length;
    el('q-score').textContent    = s.score + ' ' + score;
    el('q-bar').style.width      = pct + '%';
    el('q-domain').textContent   = DOMAIN_LABELS[lang][q.domain].toUpperCase();
    el('q-category').textContent = DIFFICULTY_LABELS[lang][q.difficulty];
    el('q-text').textContent     = q.text;
    el('q-sub').textContent      = q.sub || '';

    var fb      = el('q-feedback');
    fb.className   = 'feedback';
    fb.textContent = '';

    var btnNext = el('btn-next');
    btnNext.classList.remove('show');
    btnNext.textContent = s.next;

    var list = el('q-opts');
    list.innerHTML = '';
    for (var i = 0; i < q.opts.length; i++) {
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.setAttribute('data-idx', i);
      btn.innerHTML =
        '<span class="opt-key">' + LETTERS[i] + '</span>' +
        '<span>' + q.opts[i] + '</span>';
      list.appendChild(btn);
    }

    el('timer-shell').classList.remove('urgent');
    startTimer();
  }

  /* ── timer ──────────────────────────────────────────────── */
  function startTimer() {
    secs = 30;
    refreshTimer();
    timerID = setInterval(function () {
      secs--;
      refreshTimer();
      if (secs <= 10) { el('timer-shell').classList.add('urgent'); }
      if (secs <= 0)  { clearInterval(timerID); if (!done) { timeOut(); } }
    }, 1000);
  }

  function refreshTimer() {
    var ratio = secs / 30;
    el('t-ring').style.strokeDashoffset = CIRC * (1 - ratio);
    el('t-num').textContent = secs;
  }

  /* ── answer handling ────────────────────────────────────── */
  function pick(idx) {
    if (done) { return; }
    done = true;
    clearInterval(timerID);

    var q    = QUESTIONS[cur];
    var s    = UI_STRINGS[lang];
    var opts = document.querySelectorAll('.opt');
    for (var i = 0; i < opts.length; i++) { opts[i].disabled = true; }

    answers[cur] = idx;

    if (idx === q.answer) {
      score++;
      domainHits[q.domain]++;
      opts[idx].classList.add('state-correct');
      showFeedback('fb-ok', s.correct);
    } else {
      opts[idx].classList.add('state-wrong');
      opts[q.answer].classList.add('state-reveal');
      showFeedback('fb-no', s.incorrect + LETTERS[q.answer]);
    }

    el('q-score').textContent = s.score + ' ' + score;
    el('btn-next').classList.add('show');
  }

  function timeOut() {
    done = true;
    var q    = QUESTIONS[cur];
    var s    = UI_STRINGS[lang];
    var opts = document.querySelectorAll('.opt');
    for (var i = 0; i < opts.length; i++) { opts[i].disabled = true; }
    opts[q.answer].classList.add('state-reveal');
    showFeedback('fb-timeout', s.timeout + LETTERS[q.answer]);
    el('btn-next').classList.add('show');
  }

  function showFeedback(cls, msg) {
    var fb      = el('q-feedback');
    fb.textContent = msg;
    fb.className   = 'feedback show ' + cls;
  }

  function nextQuestion() {
    cur++;
    if (cur >= QUESTIONS.length) { showResults(); } else { renderQuestion(); }
  }

  /* ── results ────────────────────────────────────────────── */
  function calcIQ(correct) {
    return Math.round(70 + (correct / QUESTIONS.length) * 75);
  }

  function iqLabel(iq) {
    var classes    = UI_STRINGS[lang].iqClasses;
    var thresholds = [145, 130, 120, 110, 90, 80, 0];
    for (var i = 0; i < thresholds.length; i++) {
      if (iq >= thresholds[i]) { return classes[thresholds[i]]; }
    }
    return classes[0];
  }

  function showResults() {
    clearInterval(timerID);
    show('p-result');

    var s   = UI_STRINGS[lang];
    var st  = STAT_LABELS[lang];
    var dl  = DOMAIN_LABELS[lang];
    var iq  = calcIQ(score);
    var lbl = iqLabel(iq);

    el('r-eyebrow').textContent = s.scoreLabel;
    el('r-class').textContent   = lbl[0];
    el('r-desc').textContent    = lbl[1];
    el('r-pct').textContent     = lbl[2];

    var wrong   = 0;
    var timeout = 0;
    for (var i = 0; i < answers.length; i++) {
      if (answers[i] === -1)                       { timeout++; }
      else if (answers[i] !== QUESTIONS[i].answer) { wrong++;   }
    }
    el('r-correct').textContent  = score;
    el('r-wrong').textContent    = wrong;
    el('r-timeout').textContent  = timeout;
    el('lbl-correct').textContent = st.correct;
    el('lbl-wrong').textContent   = st.wrong;
    el('lbl-timeout').textContent = st.timeout;

    el('domains-title').textContent = s.breakdown;
    el('lbl-verbal').textContent    = dl.Verbal;
    el('lbl-numerical').textContent = dl.Numerical;
    el('lbl-spatial').textContent   = dl.Spatial;
    el('lbl-logic').textContent     = dl.Logic;

    var domains      = ['Verbal', 'Numerical', 'Spatial', 'Logic'];
    var domainScores = {};
    for (var d = 0; d < domains.length; d++) {
      var dom   = domains[d];
      var ratio = domainTotals[dom] > 0 ? domainHits[dom] / domainTotals[dom] : 0;
      domainScores[dom] = ratio;
      var pct   = Math.round(ratio * 100);
      el('bar-' + dom.toLowerCase()).style.width = pct + '%';
      el('pct-' + dom.toLowerCase()).textContent = pct + '%';
    }

    var profile = getCognitiveProfile(domainScores, lang);
    el('profile-label').textContent = s.profileLabel;
    el('profile-key').textContent   = profile.key;
    el('profile-desc').textContent  = profile.desc;

    el('btn-restart').textContent = s.retake;
    el('btn-share').textContent   = s.share;
    el('result-note').textContent = s.percentileNote;

    var display = el('r-iq');
    var current = Math.round(iq * 0.6);
    display.textContent = current;
    var step = setInterval(function () {
      current += Math.ceil((iq - current) / 5);
      if (current >= iq) { current = iq; clearInterval(step); }
      display.textContent = current;
    }, 35);
  }

  /* ── event listeners ────────────────────────────────────── */
  el('btn-lang').addEventListener('click', toggleLang);
  el('btn-contrast').addEventListener('click', toggleContrast);

  el('btn-start').addEventListener('click', startTest);

  el('btn-next').addEventListener('click', nextQuestion);

  el('btn-restart').addEventListener('click', function () {
    renderIntro();
    show('p-intro');
  });

  el('btn-share').addEventListener('click', function () {
    var s = UI_STRINGS[lang];
    navigator.clipboard.writeText(window.location.href).then(function () {
      var old = el('btn-share').textContent;
      el('btn-share').textContent = s.copied;
      setTimeout(function () { el('btn-share').textContent = old; }, 2000);
    }).catch(function () {});
  });

  el('q-opts').addEventListener('click', function (e) {
    var btn = e.target.closest('.opt');
    if (btn && !done) {
      pick(parseInt(btn.getAttribute('data-idx'), 10));
    }
  });

  renderIntro();
};
</script>
</body>
</html>
